schema = "pentect.plugin.v1"
name = "openai-privacy-filter"
description = "Local privacy-filter model."
binary = "pentect-pii-ner"
repository = "EdamAme-x/pentect"

[publisher]
workflow = ".github/workflows/release.yml"

[execution]
runtime = "native"
mode = "persistent"

[middleware]
stages = ["detect"]
permissions = ["input:read"]
required = false
