schema = "pentect.plugin.v1"
name = "openai-privacy-filter"
description = "Detect private text with OpenAI Privacy Filter running on your computer."
hooks = ["inspect"]
required = false

[commands]
windows = ["py", "{plugin}/server.py", "--device", "cpu"]
macos = ["python3", "{plugin}/server.py", "--device", "cpu"]
linux = ["python3", "{plugin}/server.py", "--device", "cpu"]

[execution]
timeout_ms = 60000
max_input_bytes = 1048576
max_output_bytes = 1048576
max_spans = 4096
