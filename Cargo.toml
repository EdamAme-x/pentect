[workspace]
resolver = "2"
members = ["crates/pentect-core", "crates/pentect-cli", "crates/pentect-runtime"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/EdamAme-x/pentect"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
fancy-regex = "0.18"
simd-json = "0.17"
regex = "1"
memchr = "2"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
zeroize = "1"
unicode-normalization = "0.1"
data-encoding = "2"
bs58 = "0.5"
bip39 = { version = "2.2.2", features = ["all-languages"] }
flate2 = "1"
getrandom = "0.2"
ignore = "0.4"
jiff = "0.2"
toml = "0.8"
phonenumber = "0.3"
pdf-extract = "0.10.0"
anstream = "0.6"
crossterm = "0.28"
csv = "1"
ed25519-dalek = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
