[workspace]
resolver = "2"
members = [
    "crates/pentect-core",
    "crates/pentect-cli",
    "crates/pentect-runtime",
    "plugins/pii-ner/plugin",
]
exclude = ["tools/pentect-bench"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/EdamAme-x/pentect"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
serde_yaml = "0.9"
fancy-regex = "0.18"
tract-onnx = "0.23.3"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
simd-json = "0.17"
regex = "1"
memchr = "2"
zerocopy = { version = "0.8.52", features = ["derive"] }
sha3 = "0.10"
hmac = "0.12"
zeroize = "1"
unicode-normalization = "0.1"
data-encoding = "2"
chacha20 = "0.10.1"
bs58 = "0.5"
bip39 = { version = "2.2.2", features = ["all-languages"] }
flate2 = "1"
getrandom = "0.2"
ignore = "0.4"
jiff = "0.2"
toml = "0.8"
toml_edit = "0.22"
phonenumber = "0.3.10"
prost = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "full_barcode_format_support", "multi_barcode_readers", "encoding_rs"] }
ocrs = "0.12.2"
rten = { version = "0.24.0", default-features = false, features = ["rten_format"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "stream"] }
futures-util = "0.3"
anstream = "0.6"
crossterm = "0.28"
ctrlc = { version = "3.4", features = ["termination"] }
portable-pty = "0.9.0"
ed25519-dalek = "2"
wasmi = { version = "1.1", default-features = false, features = ["std", "extra-checks"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
windows = "0.62.2"
objc2 = { version = "0.6.3", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-vision = { version = "0.3.2", default-features = false }
