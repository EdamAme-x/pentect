[workspace]
resolver = "2"
members = ["crates/pentect-core", "crates/pentect-cli", "crates/pentect-agent"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/EdamAme-x/pentect"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.17"
regex = "1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
zeroize = "1"
unicode-normalization = "0.1"
data-encoding = "2"
bs58 = "0.5"
flate2 = "1"
getrandom = "0.2"
toml = "0.8"
phonenumber = "0.3"
pdf-extract = "0.10.0"
anstream = "0.6"
ratatui = "0.29"
crossterm = "0.28"
ed25519-dalek = "2"
