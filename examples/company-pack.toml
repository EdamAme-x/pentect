# Pentect rule pack — tune what gets masked. Two things you can do:
#   (A) turn OFF built-in detectors you don't want, and
#   (B) add your own company-specific things to mask.
# Load it with:  pentect mask --pack examples/company-pack.toml < input.txt
# Extension form: examples/extensions/company/pack.toml
# You do NOT need to know regular expressions.

# (A) Turn OFF built-in detectors by label. E.g. if your logs are full of
#     internal IPs and phone numbers you'd rather keep readable:
disable = [
  "IP_ADDRESS_V4",
  "IP_ADDRESS_V6",
  "PHONE_NANP",
]
# Built-in labels include: CARD, IBAN_CODE, US_SSN, ETH_ADDRESS, BTC_ADDRESS,
# BIP39_MNEMONIC, MAC_ADDRESS, EU_VAT, ... (the label shown in the <<LABEL_..>>).

# (B) Add company terms to mask — just list them. Masked wherever they appear
#     (case-insensitive). category defaults to "secret".
[[detector]]
keywords = [
  "Project Titan",          # internal codename
  "vault.acme.internal",    # internal hostname
  "acme-prod-db",           # internal system name
]

# Optional: a nicer label and category (secret | pii | identifier | endpoint).
[[detector]]
keywords = ["bastion.acme.internal", "jump.acme.internal"]
category = "endpoint"
label = "internal host"

# For people who DO know regex: a 'pattern' (and an optional checksum
# 'validator' like luhn / iban_mod97 / verhoeff to cut false positives).
[[detector]]
pattern = '\bEMP-[0-9]{6}\b'
category = "identifier"
label = "EMPLOYEE_ID"
