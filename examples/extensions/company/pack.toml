# Company rules-pack extension. Load with:
#   pentect --extensions company codex
#   pentect mask --extensions company < input.txt
# Use this for stable company-specific literals and syntax. Use adapter.toml
# for NER/model-backed language detection.

[[detector]]
keywords = [
  "Project Titan",
  "vault.acme.internal",
  "acme-prod-db",
]
category = "secret"
label = "COMPANY_SECRET"

[[detector]]
keywords = [
  "bastion.acme.internal",
  "jump.acme.internal",
]
category = "endpoint"
label = "INTERNAL_HOST"

[[detector]]
pattern = '\bEMP-[0-9]{6}\b'
category = "identifier"
label = "EMPLOYEE_ID"
