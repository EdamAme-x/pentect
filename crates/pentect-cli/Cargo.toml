[package]
name = "pentect-cli"
version = "0.0.1"
description = "Pentect CLI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pentect"
path = "src/main.rs"

[features]
default = ["pdf"]
# PDF input is an adapter concern: extract text locally, then feed the normal
# masking kernel. Disable default features for a slimmer text-only CLI.
pdf = ["dep:pdf-extract"]

[dependencies]
pentect-core = { path = "../pentect-core" }
pentect-runtime = { path = "../pentect-runtime" }
anyhow = { workspace = true }
pdf-extract = { workspace = true, optional = true }
serde_json = { workspace = true }
crossterm = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
