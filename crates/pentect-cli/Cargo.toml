[package]
name = "pentect-cli"
version = "0.0.4"
description = "Pentect CLI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pentect"
path = "src/main.rs"

[features]
default = ["ocr"]
ocr = ["pentect-runtime/ocr"]

[dependencies]
pentect-core = { path = "../pentect-core" }
pentect-runtime = { path = "../pentect-runtime", default-features = false }
anyhow = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
zerocopy = { workspace = true }
portable-pty = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["io-util", "macros", "process", "sync"] }
data-encoding.workspace = true
getrandom = { workspace = true }
ctrlc.workspace = true
reqwest.workspace = true
futures-util = { workspace = true }
pdf-extract = "0.9"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
