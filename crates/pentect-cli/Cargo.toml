[package]
name = "pentect-cli"
version = "0.0.1"
description = "Pentect CLI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pentect"
path = "src/main.rs"

[features]
default = ["pdf", "ocr"]
# PDF input is an adapter concern: extract text locally, then feed the normal
# masking kernel. Disable default features for a slimmer text-only CLI.
pdf = ["dep:pdf-extract", "pentect-runtime/pdf"]
ocr = ["pentect-runtime/ocr"]

[dependencies]
pentect-core = { path = "../pentect-core" }
pentect-runtime = { path = "../pentect-runtime", default-features = false }
anyhow = { workspace = true }
ignore = { workspace = true }
pdf-extract = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
zerocopy = { workspace = true }
crossterm = { workspace = true }
portable-pty = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }
fastwebsockets = { version = "0.10.0", features = ["upgrade"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["io-util", "macros", "process", "sync"] }
data-encoding.workspace = true
getrandom = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
