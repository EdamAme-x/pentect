[package]
name = "pentect-runtime"
version = "0.0.1"
description = "Pentect tool-boundary runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[lib]
name = "pentect_agent"
path = "src/main.rs"

[features]
default = ["pdf", "ocr"]
pdf = ["dep:pdf-extract"]
ocr = ["dep:image", "dep:ocrs", "dep:reqwest", "dep:rten"]

[dependencies]
pentect-core = { path = "../pentect-core" }
anyhow = { workspace = true }
axum = { workspace = true }
data-encoding = { workspace = true }
pdf-extract = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ocrs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
chacha20 = { workspace = true }
toml = { workspace = true }
anstream = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
