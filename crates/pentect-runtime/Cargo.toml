[package]
name = "pentect-runtime"
version = "0.0.1"
description = "Pentect tool-boundary runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[lib]
name = "pentect_agent"
path = "src/main.rs"

[features]
default = ["ocr"]
ocr = [
    "dep:flate2",
    "dep:hickory-resolver",
    "dep:tokio",
    "native-ocr",
    "bundled-ocr",
    "barcode",
]
barcode = ["dep:image", "dep:rxing"]
native-ocr = [
    "dep:windows",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-vision",
]
bundled-ocr = ["dep:image", "dep:ocrs", "dep:rten"]

[dependencies]
pentect-core = { path = "../pentect-core" }
aho-corasick = { workspace = true }
anyhow = { workspace = true }
data-encoding = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
rxing = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
chacha20 = { workspace = true }
toml = { workspace = true }
anstream = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
wasmi = { workspace = true }
hickory-resolver = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
windows = { workspace = true, optional = true, features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
] }
objc2-core-foundation = { workspace = true, optional = true, default-features = false, features = [
    "CFCGTypes",
] }
objc2-vision = { workspace = true, optional = true, default-features = false, features = [
    "objc2-core-foundation",
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }

[dev-dependencies]
rxing = { workspace = true, features = ["encoders"] }
wat = "1"
