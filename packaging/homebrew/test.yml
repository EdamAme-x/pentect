name: Test formula

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit, install, and remove
        run: |
          brew style Formula/pentect.rb
          brew install EdamAme-x/pentect/pentect
          pentect version
          if pentect uninstall 2>uninstall.err; then
            echo "package-managed uninstall unexpectedly succeeded" >&2
            exit 1
          fi
          test -x "$(command -v pentect)"
          brew uninstall EdamAme-x/pentect/pentect
          test ! -e "$(brew --prefix)/bin/pentect"
