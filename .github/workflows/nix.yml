name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - packaging/release.json
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packaging/release.json
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Evaluate all supported systems
        run: nix flake check --no-build

  update-lock:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Update and publish the lock file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m "chore: update Nix lock [skip ci]"
          git config --local credential.helper '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
          git push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:main
          git config --local --unset-all credential.helper
