name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - packaging/release.json
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packaging/release.json
      - .github/workflows/nix.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      update_lock:
        description: Update flake.lock and propose the result
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Evaluate all supported systems
        run: nix flake check --no-build

  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Install, run, and remove Pentect
        run: |
          profile="$RUNNER_TEMP/pentect-profile"
          version="$(jq -r .version packaging/release.json)"
          nix profile install .#pentect --profile "$profile"
          test "$("$profile/bin/pentect" version)" = "pentect $version"
          nix profile remove pentect --profile "$profile"
          test ! -e "$profile/bin/pentect"

  update-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.update_lock
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Update and propose the lock file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m "chore: update Nix lock"
          sh tools/propose_automation_pr.sh \
            "automation/nix-lock" \
            "chore: update Nix lock" \
            "Automated Nix lock update generated by workflow run $GITHUB_RUN_ID."
