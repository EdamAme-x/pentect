name: CredSweeper regression

on:
  schedule:
    # Compare the native port with the latest upstream release every Monday.
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - '.github/workflows/credsweeper-regression.yml'
      - '.github/workflows/update-credsweeper.yml'
      - '.gitmodules'
      - 'benchmarks/CredData/**'
      - 'crates/pentect-core/build.rs'
      - 'crates/pentect-core/src/detect/credsweeper.rs'
      - 'crates/pentect-core/src/detect/credsweeper_ml.rs'
      - 'crates/pentect-core/vendors/CredSweeper'
      - 'crates/pentect-core/vendors/credsweeper-assets/**'
      - 'tools/check_credsweeper_regression.py'
      - 'tools/credsweeper-sidecar/**'
      - 'tools/pentect-bench/**'
      - 'tools/update_credsweeper.py'
  pull_request:
    paths:
      - '.github/workflows/credsweeper-regression.yml'
      - '.github/workflows/update-credsweeper.yml'
      - '.gitmodules'
      - 'benchmarks/CredData/**'
      - 'crates/pentect-core/build.rs'
      - 'crates/pentect-core/src/detect/credsweeper.rs'
      - 'crates/pentect-core/src/detect/credsweeper_ml.rs'
      - 'crates/pentect-core/vendors/CredSweeper'
      - 'crates/pentect-core/vendors/credsweeper-assets/**'
      - 'tools/check_credsweeper_regression.py'
      - 'tools/credsweeper-sidecar/**'
      - 'tools/pentect-bench/**'
      - 'tools/update_credsweeper.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credsweeper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false

      - name: Select baseline revision
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule ]]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Check out baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: credsweeper-regression
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Sync latest CredSweeper release for weekly parity check
        if: github.event_name == 'schedule'
        run: python tools/update_credsweeper.py latest

      - name: Install official CredSweeper oracle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/credsweeper-sidecar/runtime-requirements.txt

      - name: Prepare pinned CredData shard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import binascii
          import json
          from pathlib import Path

          root = Path("benchmarks/CredData")
          snapshot_path = root / "snapshot.json"
          snapshot = json.loads(snapshot_path.read_text())
          shard = {
              repo_id: url
              for repo_id, url in snapshot.items()
              if f"{binascii.crc32(bytes.fromhex(repo_id)):08x}" == "02dfa7ec"
          }
          if len(shard) != 1:
              raise SystemExit(f"expected one CredData shard, got {len(shard)}")
          snapshot_path.write_text(json.dumps(shard, indent=2) + "\n")
          for meta_path in (root / "meta").glob("*.csv"):
              if meta_path.name != "02dfa7ec.csv":
                  meta_path.unlink()
          PY
          (cd benchmarks/CredData && python download_data.py --clean_data --jobs 1)

      - name: Build candidate and baseline benchmarks
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/target/credsweeper-regression"
          cp -a baseline "$RUNNER_TEMP/credsweeper-baseline"
          cargo build --release --manifest-path tools/pentect-bench/Cargo.toml \
            --target-dir "$target"
          cp "$target/release/pentect-bench" "$RUNNER_TEMP/pentect-bench-candidate"
          cargo build --release \
            --manifest-path "$RUNNER_TEMP/credsweeper-baseline/tools/pentect-bench/Cargo.toml" \
            --target-dir "$target"
          cp "$target/release/pentect-bench" "$RUNNER_TEMP/pentect-bench-baseline"

      - name: Check detection quality and speed against baseline
        shell: bash
        run: |
          python tools/check_credsweeper_regression.py \
            --candidate "$RUNNER_TEMP/pentect-bench-candidate" \
            --baseline "$RUNNER_TEMP/pentect-bench-baseline" \
            --dataset benchmarks/CredData \
            --repo 02dfa7ec \
            --rounds 7 \
            --max-slowdown 1.20 \
            --absolute-allowance-ms 10

      - name: Check native port against official CredSweeper
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credsweeper-parity"
          mkdir -p "$out"
          "$RUNNER_TEMP/pentect-bench-candidate" creddata benchmarks/CredData \
            --repo 02dfa7ec \
            --ignore-x \
            --save-credsweeper-json "$out/rust.json" \
            --save-credsweeper-paths "$out/paths.txt" \
            --json
          mapfile -t paths < "$out/paths.txt"
          PYTHONPATH="$PWD/crates/pentect-core/vendors/CredSweeper" \
            python tools/credsweeper-sidecar/sidecar.py "${paths[@]}" --output "$out/oracle.json"
          "$RUNNER_TEMP/pentect-bench-candidate" credsweeper-parity \
            "$out/rust.json" \
            "$out/oracle.json" \
            --min-precision 1 \
            --min-recall 1 \
            --json
