name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'EdamAme-x/pentect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/alcatraz-helper/go.mod
          cache-dependency-path: tools/alcatraz-helper/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag, version, and commit
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages |
            Where-Object { $_.name -eq 'pentect-cli' } |
            Select-Object -ExpandProperty version -First 1
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME must match pentect-cli version v$version"
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "release tag must point at a commit in origin/main history"
          }
      - name: Validate POSIX installer
        run: |
          sh -n tools/install.sh tools/install-apt.sh tools/package_deb.sh tools/build_apt_repository.sh tools/download_recent_stable_debs.sh tools/dispatch_package_site.sh tools/propose_automation_pr.sh tools/wait_for_automation_pr.sh tools/install_client_smoke.sh tools/test_install.sh tools/testdata/install-curl.sh
          sh tools/test_download_recent_stable_debs.sh
          sh tools/test_install.sh
          bash -n .github/scripts/publish-aur.sh
          python tools/test_client_smoke_coverage.py
          python tools/test_release_package_metadata.py
          python -m unittest tools/test_creddata_shards.py tools/test_verify_credsweeper_evidence.py
          python -m py_compile tools/client_smoke.py tools/creddata_shards.py tools/install_portable_client_smoke.py tools/installed_agent_e2e.py tools/test_client_smoke_coverage.py tools/test_release_package_metadata.py tools/test_verify_credsweeper_evidence.py tools/verify_client_smoke_log.py tools/verify_credsweeper_evidence.py
          cc -std=c11 -Wall -Wextra -Werror tools/codex-app-smoke-fixture.c -o "$RUNNER_TEMP/codex-app-smoke-fixture"
          cc -std=c11 -Wall -Wextra -Werror tools/claude-app-smoke-fixture.c -o "$RUNNER_TEMP/claude-app-smoke-fixture"
          node --check tools/smoke_pi_package.mjs
          sh tools/test_wait_for_npm_version.sh
          python tools/test_npm_release_workflow.py
          sh tools/test_propose_automation_pr.sh
          sh tools/test_dispatch_package_site.sh
          sh tools/test_wait_for_automation_pr.sh
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          foreach ($path in @('tools/install.ps1', 'tools/release_live_e2e.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "$path`n$($errors | Out-String)"
            }
          }
          & ./tools/test_install.ps1
      - name: Verify third-party licenses
        run: python tools/generate_licenses.py --check
      - name: Verify package metadata generator
        run: python tools/update_package_metadata.py --metadata-file packaging/release.json --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify npm package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "tag $env:GITHUB_REF_NAME must match npm package version v$($package.version)"
          }
          npm test
          npm pack --dry-run
          Push-Location integrations/pi
          try {
            npm run check
            npm test
            npm pack --dry-run
          } finally {
            Pop-Location
          }
      - name: Stage release notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notices
          path: |
            LICENSE
            THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7

  credsweeper-evidence:
    name: CredSweeper release evidence
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run full parity for the exact release commit
        id: parity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow credsweeper-regression.yml \
            --event workflow_dispatch \
            --commit "$GITHUB_SHA" \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' > "$RUNNER_TEMP/parity-runs-before"
          gh workflow run credsweeper-regression.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f full=true \
            -f sync_latest=false

          run_id=""
          for _ in $(seq 1 30); do
            while IFS= read -r candidate; do
              if ! grep -Fxq "$candidate" "$RUNNER_TEMP/parity-runs-before"; then
                run_id="$candidate"
                break
              fi
            done < <(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow credsweeper-regression.yml \
              --event workflow_dispatch \
              --commit "$GITHUB_SHA" \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId')
            test -n "$run_id" && break
            sleep 2
          done
          if test -z "$run_id"; then
            echo "Could not locate the dispatched CredSweeper parity run" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Full release parity: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Download and verify release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PARITY_RUN_ID: ${{ steps.parity.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          gh run download "$PARITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name credsweeper-compatibility-evidence \
            --dir evidence
          python tools/verify_credsweeper_evidence.py \
            evidence/pentect-credsweeper-compatibility.json \
            --source crates/pentect-core/vendors/credsweeper-assets/SOURCE.json \
            --creddata-snapshot benchmarks/CredData/snapshot.json \
            --pentect-commit "$GITHUB_SHA" \
            --tested-ref "$GITHUB_REF_NAME" \
            --creddata-commit "$(git -C benchmarks/CredData rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credsweeper-compatibility-evidence
          path: evidence/pentect-credsweeper-compatibility.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pentect-windows-x86_64.exe
            binary: target/release/pentect.exe
          - os: ubuntu-22.04
            asset: pentect-linux-x86_64
            binary: target/release/pentect
          - os: ubuntu-22.04-arm
            asset: pentect-linux-aarch64
            binary: target/release/pentect
          - os: macos-15-intel
            asset: pentect-macos-x86_64
            binary: target/release/pentect
          - os: macos-15
            asset: pentect-macos-aarch64
            binary: target/release/pentect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/alcatraz-helper/go.mod
          cache-dependency-path: tools/alcatraz-helper/go.sum
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        id: rust-cache
        with:
          shared-key: release-${{ matrix.asset }}
      - name: Set up shared compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Report release build environment
        shell: pwsh
        run: |
          "Runner: $env:RUNNER_OS/$env:RUNNER_ARCH"
          "Processors: $([Environment]::ProcessorCount)"
          "Rust cache hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          rustc --version --verbose
          cargo --version --verbose
          go version
      - name: Build release binary
        id: release-build
        shell: pwsh
        env:
          PENTECT_REQUIRE_ALCATRAZ: "1"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: pentect-release-v1-${{ matrix.asset }}
        run: |
          & $env:SCCACHE_PATH --zero-stats
          if ($LASTEXITCODE -ne 0) { throw 'could not reset sccache statistics' }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked --timings -p pentect-cli
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          "Release build elapsed: $($timer.Elapsed)"
          "elapsed_seconds=$([Math]::Round($timer.Elapsed.TotalSeconds, 3))" >> $env:GITHUB_OUTPUT
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Record compiler cache statistics
        if: always()
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: pentect-release-v1-${{ matrix.asset }}
        run: |
          $stats = (& $env:SCCACHE_PATH --show-stats 2>&1 | Out-String).Trim()
          $exitCode = $LASTEXITCODE
          $stats
          $stats | Set-Content -Encoding utf8 sccache-stats.txt
          @"
          #### sccache

          ``````text
          $stats
          ``````
          "@ >> $env:GITHUB_STEP_SUMMARY
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Summarize release build diagnostics
        if: always()
        shell: pwsh
        run: |
          $targetBytes = if (Test-Path target) {
            (Get-ChildItem target -File -Recurse | Measure-Object Length -Sum).Sum
          } else { 0 }
          $targetMiB = [Math]::Round($targetBytes / 1MB, 1)
          @"
          ### ${{ matrix.asset }} build diagnostics

          - Runner: `$env:RUNNER_OS/$env:RUNNER_ARCH`
          - Logical processors: $([Environment]::ProcessorCount)
          - Rust cache hit: `${{ steps.rust-cache.outputs.cache-hit }}`
          - Release build: `${{ steps.release-build.outputs.elapsed_seconds }}` seconds
          - Target directory: ${targetMiB} MiB
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ matrix.asset }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14
      - name: Upload compiler cache statistics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sccache-statistics-${{ matrix.asset }}
          path: sccache-stats.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Verify bundled Alcatraz without an external Go runtime
        shell: pwsh
        run: |
          $env:PATH = if ($IsWindows) { "$env:WINDIR\System32;$env:WINDIR" } else { '/usr/bin:/bin' }
          $sample = 'Contact alice@example.com or +1 415-555-2671. Card 4111 1111 1111 1111. IBAN DE89 3704 0044 0532 0130 00. NINO AB 12 34 56 C.'
          $masked = $sample | & '${{ matrix.binary }}' mask --kind text 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Pentect mask failed' }
          if ($masked -match 'alice@example.com|415-555-2671|4111 1111 1111 1111') {
            throw "Alcatraz leaked test PII: $masked"
          }
          foreach ($label in @('EMAIL_ADDRESS', 'PHONE_NUMBER', 'CREDIT_CARD', 'IBAN_CODE', 'UK_NINO')) {
            if ($masked -notmatch "<<${label}_[0-9a-f]{16}>>") {
              throw "Missing $label handle: $masked"
            }
          }
      - name: Package binary and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = '${{ matrix.asset }}'
          $destination = Join-Path dist $asset
          Copy-Item '${{ matrix.binary }}' $destination
          $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline -Encoding utf8 "$destination.sha256"
          $source = [System.IO.File]::OpenRead($destination)
          $archive = [System.IO.File]::Create("$destination.gz")
          try {
            $gzip = [System.IO.Compression.GZipStream]::new(
              $archive,
              [System.IO.Compression.CompressionLevel]::SmallestSize,
              $true
            )
            try { $source.CopyTo($gzip) } finally { $gzip.Dispose() }
          } finally {
            $archive.Dispose()
            $source.Dispose()
          }
      - name: Attest release binaries
        uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4 # v3
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package-deb:
    name: Debian package (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: pentect-linux-x86_64
          - arch: arm64
            artifact: pentect-linux-aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: binary
      - name: Build Debian package
        run: |
          chmod +x "binary/${{ matrix.artifact }}"
          bash tools/package_deb.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}" \
            "binary/${{ matrix.artifact }}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pentect-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  apt-repository:
    name: Build signed APT repository
    needs: package-deb
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pentect-deb-*
          path: debs
          merge-multiple: true
      - name: Install repository tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg
      - name: Add historical stable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/download_recent_stable_debs.sh debs 2
          test -n "$(find debs -name 'pentect_*.deb' -print -quit)"
      - name: Import archive signing key
        id: signing
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          expected=$(cat packaging/apt/KEY_FINGERPRINT)
          test "$fingerprint" = "$expected"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Build signed repository
        env:
          KEY_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          bash tools/build_apt_repository.sh debs site packaging/apt/pentect-archive-keyring.asc "$KEY_FINGERPRINT"
          bytes=$(du -sb site | awk '{print $1}')
          packages=$(find site -type f -name '*.deb' | wc -l)
          echo "APT repository: $packages package files, $bytes bytes"
          test "$bytes" -le 800000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-site
          path: site
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, compatibility-cli, package-deb, credsweeper-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pentect-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notices
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: credsweeper-compatibility-evidence
          path: dist
      - name: Stage prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets)
            test "$(jq -r .isDraft <<<"$release")" = false
            if test "$(jq -r .isPrerelease <<<"$release")" != true; then
              asset_count=$(jq '.assets | length' <<<"$release")
              if test "$asset_count" != 0; then
                echo "refusing to replace assets on an existing stable release" >&2
                exit 1
              fi
              echo "existing stable release has no uploaded assets; returning it to prerelease validation"
              gh release edit "$GITHUB_REF_NAME" --prerelease --repo "$GITHUB_REPOSITORY"
              release=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease,assets)
            fi

            find dist -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/local-assets"
            jq -r '.assets[].name' <<<"$release" | sort > "$RUNNER_TEMP/remote-assets"
            if unexpected=$(comm -23 "$RUNNER_TEMP/remote-assets" "$RUNNER_TEMP/local-assets") && test -n "$unexpected"; then
              echo "existing prerelease contains unexpected assets:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi

            missing=()
            while IFS= read -r path; do
              name=$(basename "$path")
              present=$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release")
              if test "$present" = 0; then
                missing+=("$path")
                continue
              fi
              remote=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release")
              if test -z "$remote"; then
                echo "refusing to trust $name: GitHub did not return its digest" >&2
                exit 1
              fi
              local_digest="sha256:$(sha256sum "$path" | awk '{print $1}')"
              if test "$remote" != "$local_digest"; then
                echo "refusing to replace $name: published digest differs" >&2
                exit 1
              fi
            done < <(find dist -maxdepth 1 -type f -print | sort)
            if test "${#missing[@]}" -gt 0; then
              gh release upload "$GITHUB_REF_NAME" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            mapfile -d '' -t release_assets < <(
              find dist -maxdepth 1 -type f -print0 | sort -z
            )
            test "${#release_assets[@]}" -gt 0
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Pentect $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi

  compatibility-cli:
    name: CLI compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PENTECT_LOG_DIR: ${{ github.workspace }}/.pentect-compatibility-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pentect-linux-x86_64
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install supported agent CLIs
        run: python tools/install_portable_client_smoke.py --mode release
      - name: Verify every public client launcher
        run: |
          chmod +x dist/pentect-linux-x86_64
          export PENTECT_SMOKE_BINARY="$PWD/dist/pentect-linux-x86_64"
          python tools/client_smoke.py --group portable
          python tools/verify_client_smoke_log.py \
            "$PENTECT_LOG_DIR/pentect.log" \
            codex claude opencode pi

  lifecycle:
    name: Installer smoke (${{ matrix.os }}, ${{ matrix.installer }})
    needs: [publish, package-deb]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer: direct
          - os: windows-latest
            installer: npm
          - os: ubuntu-22.04
            installer: direct
          - os: ubuntu-22.04
            installer: npm
          - os: ubuntu-22.04
            installer: deb
            artifact: pentect-deb-amd64
          - os: ubuntu-22.04-arm
            installer: direct
          - os: ubuntu-22.04-arm
            installer: npm
          - os: ubuntu-22.04-arm
            installer: deb
            artifact: pentect-deb-arm64
          - os: macos-15-intel
            installer: direct
          - os: macos-15-intel
            installer: npm
          - os: macos-15
            installer: direct
          - os: macos-15
            installer: npm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PENTECT_LOG_DIR: ${{ github.workspace }}/.pentect-test-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Download Debian package
        if: matrix.installer == 'deb'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install, update, and uninstall (Windows)
        if: runner.os == 'Windows' && matrix.installer == 'direct'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:PENTECT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'pentect-lifecycle\bin'
          $env:PENTECT_INSTALL_SKIP_PATH = '1'
          $env:PENTECT_UPDATE_ALLOW_PRERELEASE = '1'
          ./tools/install.ps1 -Version $version
          $binary = Join-Path $env:PENTECT_INSTALL_DIR 'pentect.exe'
          if ((& $binary version) -ne "pentect $version") { throw 'installed version mismatch' }
          & $binary update $version --force
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            Start-Sleep -Milliseconds 100
            if ((Test-Path -LiteralPath $binary) -and ((& $binary version) -eq "pentect $version")) { break }
          }
          if (-not (Test-Path -LiteralPath $binary)) { throw 'updated binary is missing' }
          $pluginProject = Join-Path $env:RUNNER_TEMP 'pentect-plugin-project'
          New-Item -ItemType Directory -Force $pluginProject | Out-Null
          Push-Location $pluginProject
          try {
            & $binary plugins add github:@EdamAme-x/pentect/plugins/example-regex --project --yes
            $masked = 'case ACME-12345678' | & $binary mask
            if (-not ($masked -match '<<ACME_CASE_')) { throw 'manifest plugin did not mask' }
            $inspection = & $binary plugins inspect (Join-Path $env:GITHUB_WORKSPACE 'plugins/openai-privacy-filter')
            if (-not ($inspection -match 'hooks: inspect')) { throw 'official plugin manifest was not inspected' }
          } finally {
            Pop-Location
          }
          "PENTECT_SMOKE_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install through npm (Windows)
        if: runner.os == 'Windows' && matrix.installer == 'npm'
        shell: pwsh
        run: |
          $env:PENTECT_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          $prefix = Join-Path $env:RUNNER_TEMP 'pentect-npm'
          npm install --global . --prefix $prefix
          $version = & (Join-Path $prefix 'pentect.cmd') version
          if ($version -ne "pentect $env:PENTECT_VERSION") { throw 'npm-installed version mismatch' }
          "PENTECT_SMOKE_BINARY=$(Join-Path $prefix 'pentect.cmd')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install, update, and uninstall (POSIX)
        if: runner.os != 'Windows' && matrix.installer == 'direct'
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          export PENTECT_INSTALL_DIR="$RUNNER_TEMP/pentect-lifecycle/bin"
          export PENTECT_UPDATE_ALLOW_PRERELEASE=1
          ./tools/install.sh --version "$version"
          binary="$PENTECT_INSTALL_DIR/pentect"
          test "$("$binary" version)" = "pentect $version"
          "$binary" update "$version" --force
          test "$("$binary" version)" = "pentect $version"
          plugin_project="$RUNNER_TEMP/pentect-plugin-project"
          mkdir -p "$plugin_project"
          (
            cd "$plugin_project"
            "$binary" plugins add github:@EdamAme-x/pentect/plugins/example-regex --project --yes
            printf '%s\n' 'case ACME-12345678' | "$binary" mask | grep -F '<<ACME_CASE_'
            "$binary" plugins inspect "$GITHUB_WORKSPACE/plugins/openai-privacy-filter" | grep -F 'hooks: inspect'
          )
          printf 'PENTECT_SMOKE_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Install through npm (POSIX)
        if: runner.os != 'Windows' && matrix.installer == 'npm'
        shell: sh
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          prefix="$RUNNER_TEMP/pentect-npm"
          PENTECT_VERSION="$version" npm install --global . --prefix "$prefix"
          test "$("$prefix/bin/pentect" version)" = "pentect $version"
          printf 'PENTECT_SMOKE_BINARY=%s\n' "$prefix/bin/pentect" >> "$GITHUB_ENV"
      - name: Install Debian package
        if: matrix.installer == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/pentect_*.deb
          test "$(pentect version)" = "pentect ${GITHUB_REF_NAME#v}"
          echo 'PENTECT_SMOKE_BINARY=/usr/bin/pentect' >> "$GITHUB_ENV"
      - name: Verify agent CLIs and desktop app contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/install_portable_client_smoke.py --mode release
          python tools/client_smoke.py --group portable
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { throw 'Framework C# compiler is unavailable' }
          $fixture = Join-Path $env:RUNNER_TEMP 'codex-app-fixture.exe'
          $codexSource = (Resolve-Path 'tools/codex-app-smoke-fixture.cs').Path
          & $csc /nologo /target:exe "/out:$fixture" $codexSource
          if ($LASTEXITCODE -ne 0) { throw 'Codex fixture compilation failed' }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Force $env:CODEX_HOME | Out-Null
          $config = Join-Path $env:CODEX_HOME 'config.toml'
          '# installer smoke sentinel' | Set-Content -Encoding utf8 $config
          $before = (Get-FileHash -Algorithm SHA256 $config).Hash
          & $env:PENTECT_SMOKE_BINARY codex app --app $fixture --upstream https://api.openai.com/v1
          if ($LASTEXITCODE -ne 0) { throw 'pentect codex app failed to launch' }
          if ((Get-FileHash -Algorithm SHA256 $config).Hash -ne $before) { throw 'Codex config was modified' }
          $claudeFixture = Join-Path $env:RUNNER_TEMP 'claude-app-fixture.exe'
          $claudeSource = (Resolve-Path 'tools/claude-app-smoke-fixture.cs').Path
          & $csc /nologo /target:exe "/out:$claudeFixture" $claudeSource
          if ($LASTEXITCODE -ne 0) { throw 'Claude fixture compilation failed' }
          # Root-store trust requires an interactive Windows security confirmation.
          # The dedicated Windows CA lifecycle test exercises add/find/remove across
          # processes; release smoke verifies the installed CLI's app contract here.
          & $env:PENTECT_SMOKE_BINARY claude app --check --app $claudeFixture --upstream https://api.anthropic.com
          if ($LASTEXITCODE -ne 0) { throw 'pentect claude app contract check failed' }
      - name: Verify agent CLIs and desktop app contracts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python tools/install_portable_client_smoke.py --mode release
          python tools/client_smoke.py --group portable
          fixture="$RUNNER_TEMP/codex-app-fixture"
          cc -std=c11 -Wall -Wextra -Werror tools/codex-app-smoke-fixture.c -o "$fixture"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          printf '%s\n' '# installer smoke sentinel' > "$CODEX_HOME/config.toml"
          cp "$CODEX_HOME/config.toml" "$RUNNER_TEMP/config.before"
          "$PENTECT_SMOKE_BINARY" codex app --app "$fixture" --upstream https://api.openai.com/v1
          cmp "$RUNNER_TEMP/config.before" "$CODEX_HOME/config.toml"
          claude_fixture="$RUNNER_TEMP/claude-app-fixture"
          cc -std=c11 -Wall -Wextra -Werror tools/claude-app-smoke-fixture.c -o "$claude_fixture"
          "$PENTECT_SMOKE_BINARY" claude app --yes --app "$claude_fixture" --upstream https://api.anthropic.com
      - name: Verify installed Codex, Claude, OpenCode, and Pi handle flows (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/installed_agent_e2e.py --pentect $env:PENTECT_SMOKE_BINARY
      - name: Verify installed Codex, Claude, OpenCode, and Pi handle flows (POSIX)
        if: runner.os != 'Windows'
        run: python tools/installed_agent_e2e.py --pentect "$PENTECT_SMOKE_BINARY"
      - name: Verify persistent diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $secret = 'sk-pentect-log-smoke-secret'
          & $env:PENTECT_SMOKE_BINARY __unknown_command $secret *> $null
          if ($LASTEXITCODE -ne 2) { throw 'diagnostic failure fixture returned the wrong status' }
          $logPath = (& $env:PENTECT_SMOKE_BINARY log --path | Select-Object -Last 1)
          $expected = Join-Path $env:PENTECT_LOG_DIR 'pentect.log'
          if ([IO.Path]::GetFullPath($logPath) -ne [IO.Path]::GetFullPath($expected)) {
            throw "unexpected persistent log path: $logPath"
          }
          $raw = Get-Content -LiteralPath $logPath -Raw
          if ($raw.Contains($secret)) { throw 'persistent log captured a command argument' }
          $events = $raw -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json }
          if (-not ($events | Where-Object { $_.event -eq 'finished' -and $_.surface -eq 'codex' -and $_.exit_code -eq 0 })) {
            throw 'successful Codex lifecycle was not persisted'
          }
          if (-not ($events | Where-Object { $_.event -eq 'finished' -and $_.surface -eq 'unknown' -and $_.exit_code -eq 2 })) {
            throw 'failed command lifecycle was not persisted'
          }
          python tools/verify_client_smoke_log.py $logPath codex claude opencode pi codex-app claude-app --absent $secret
      - name: Verify persistent diagnostics (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          secret='sk-pentect-log-smoke-secret'
          set +e
          "$PENTECT_SMOKE_BINARY" __unknown_command "$secret" >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          log_path=$("$PENTECT_SMOKE_BINARY" log --path)
          test "$log_path" = "$PENTECT_LOG_DIR/pentect.log"
          python3 - "$log_path" "$secret" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          secret = sys.argv[2]
          raw = path.read_text(encoding="utf-8")
          assert secret not in raw, "persistent log captured a command argument"
          events = [json.loads(line) for line in raw.splitlines() if line.strip()]
          assert any(
              event.get("event") == "finished"
              and event.get("surface") == "codex"
              and event.get("exit_code") == 0
              for event in events
          ), "successful Codex lifecycle was not persisted"
          assert any(
              event.get("event") == "finished"
              and event.get("surface") == "unknown"
              and event.get("exit_code") == 2
              for event in events
          ), "failed command lifecycle was not persisted"
          PY
          python3 tools/verify_client_smoke_log.py "$log_path" \
            codex claude opencode pi codex-app claude-app \
            --absent "$secret"
      - name: Uninstall direct installation (Windows)
        if: runner.os == 'Windows' && matrix.installer == 'direct'
        shell: pwsh
        run: |
          & $env:PENTECT_SMOKE_BINARY uninstall
          for ($attempt = 0; $attempt -lt 300 -and (Test-Path -LiteralPath $env:PENTECT_SMOKE_BINARY); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $env:PENTECT_SMOKE_BINARY) { throw 'uninstall did not remove the binary' }
      - name: Uninstall direct installation (POSIX)
        if: runner.os != 'Windows' && matrix.installer == 'direct'
        shell: sh
        run: |
          "$PENTECT_SMOKE_BINARY" uninstall
          test ! -e "$PENTECT_SMOKE_BINARY"
      - name: Remove Debian package
        if: matrix.installer == 'deb'
        run: sudo apt-get remove -y pentect

  promote:
    name: Publish stable release
    needs: [lifecycle, apt-repository, npm-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Promote validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"

  npm-publish:
    name: Publish npm packages
    needs: [lifecycle, apt-repository]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          test "$(node --print "require('./package.json').version")" = "$version"
      - name: Publish Pentect
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if tools/wait_for_npm_version.sh pentect "$version" 1 0; then
            exit 0
          else
            status=$?
          fi
          test "$status" = 4
          npm publish --access public

  npm-readiness:
    name: Wait for npm registry and publish Pi
    needs: npm-publish
    runs-on: ubuntu-latest
    # Each registry gate is at most ~5 minutes nominally (30 five-second
    # requests plus 29 five-second delays); leave room for the Pi workflow.
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Wait for exact npm version visibility
        shell: bash
        run: tools/wait_for_npm_version.sh pentect "${GITHUB_REF_NAME#v}" 30 5
      - name: Trigger matching Pi extension release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          request_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh workflow run publish-pi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f version="$version" \
            -f request_id="$request_id"
          title="Publish Pi $version $request_id"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-pi.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              | jq -r --arg title "$title" \
                '.[] | select(.displayTitle == $title) | .databaseId' \
              | head -n 1)
            test -n "$run_id" && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          tools/wait_for_npm_version.sh @pentect/pi "$version" 30 5

  package-metadata:
    name: Update package metadata
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      main_sha: ${{ steps.metadata.outputs.main_sha }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate Nix, Homebrew, and AUR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_package_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Propose metadata update
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata_paths=(
            packaging/release.json
            packaging/homebrew/Formula/pentect.rb
            packaging/aur/pentect-bin/PKGBUILD
            packaging/aur/pentect-bin/.SRCINFO
            packaging/aur/pentect-git/PKGBUILD
            packaging/aur/pentect-git/.SRCINFO
          )
          if git diff --quiet -- "${metadata_paths[@]}"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${metadata_paths[@]}"
          git commit -m "chore: update package metadata for $GITHUB_REF_NAME"
          branch="automation/package-metadata-${GITHUB_REF_NAME}"
          title="chore: update package metadata for $GITHUB_REF_NAME"
          body="Automated package metadata update generated by release workflow run $GITHUB_RUN_ID."
          pull=$(sh tools/propose_automation_pr.sh "$branch" "$title" "$body")
          sh tools/wait_for_automation_pr.sh "$pull" "$branch" "$title" "$body"
          main_sha=$(gh pr view "$pull" --repo "$GITHUB_REPOSITORY" \
            --json mergeCommit --jq .mergeCommit.oid)
          if test -z "$main_sha" || test "$main_sha" = null; then
            echo "package metadata PR merged without a merge commit" >&2
            exit 1
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          gh workflow run package-tags.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run nix.yml --repo "$GITHUB_REPOSITORY" --ref main
          aur_state=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/aur.yml" \
            --jq .state)
          if [ "$aur_state" = active ]; then
            gh workflow run aur.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish=true
          else
            echo "AUR workflow is $aur_state; skipping publication"
          fi

  apt-pages:
    name: Sync signed APT repository
    needs: package-metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dispatch APT site sync from the package metadata commit
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.package-metadata.outputs.main_sha }}
        run: |
          if test -z "$MAIN_SHA"; then
            echo "package metadata did not produce a new main commit for the APT site sync" >&2
            exit 1
          fi
          sh tools/dispatch_package_site.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$MAIN_SHA"
