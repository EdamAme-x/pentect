name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'EdamAme-x/pentect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - name: Verify tag, version, and commit
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages |
            Where-Object { $_.name -eq 'pentect-cli' } |
            Select-Object -ExpandProperty version -First 1
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME must match pentect-cli version v$version"
          }
          $main = git rev-parse origin/main
          if ($env:GITHUB_SHA -ne $main) {
            throw "release tag must point at origin/main ($main)"
          }
      - name: Validate POSIX installer
        run: sh -n tools/install.sh
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            throw ($errors | Out-String)
          }

  build:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pentect-windows-x86_64.exe
            binary: target/release/pentect.exe
          - os: ubuntu-latest
            asset: pentect-linux-x86_64
            binary: target/release/pentect
          - os: macos-15-intel
            asset: pentect-macos-x86_64
            binary: target/release/pentect
          - os: macos-15
            asset: pentect-macos-aarch64
            binary: target/release/pentect
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.asset }}
          save-if: false
      - name: Build release binary
        run: cargo build --release --locked -p pentect-cli
      - name: Package binary and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = '${{ matrix.asset }}'
          $destination = Join-Path dist $asset
          Copy-Item '${{ matrix.binary }}' $destination
          $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline -Encoding utf8 "$destination.sha256"
      - name: Attest release binaries
        uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4 # v3
        with:
          subject-path: |
            dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, compatibility-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Pentect $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi

  compatibility-cli:
    name: CLI compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pentect-linux-x86_64
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install supported agent CLIs
        run: npm install --global @openai/codex@0.146.0 @anthropic-ai/claude-code@2.1.220
      - name: Verify launchers
        run: |
          chmod +x dist/pentect-linux-x86_64
          dist/pentect-linux-x86_64 codex -- --version
          dist/pentect-linux-x86_64 claude -- --version

  lifecycle:
    name: Lifecycle (${{ matrix.os }})
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install, update, and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:PENTECT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'pentect-lifecycle\bin'
          $env:PENTECT_INSTALL_SKIP_PATH = '1'
          $env:PENTECT_UPDATE_ALLOW_PRERELEASE = '1'
          ./tools/install.ps1 -Version $version
          $binary = Join-Path $env:PENTECT_INSTALL_DIR 'pentect.exe'
          if ((& $binary version) -ne "pentect $version") { throw 'installed version mismatch' }
          & $binary update $version --force
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            Start-Sleep -Milliseconds 100
            if ((Test-Path -LiteralPath $binary) -and ((& $binary version) -eq "pentect $version")) { break }
          }
          if (-not (Test-Path -LiteralPath $binary)) { throw 'updated binary is missing' }
          & $binary uninstall
          for ($attempt = 0; $attempt -lt 100 -and (Test-Path -LiteralPath $binary); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $binary) { throw 'uninstall did not remove the binary' }
      - name: Install, update, and uninstall (POSIX)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          export PENTECT_INSTALL_DIR="$RUNNER_TEMP/pentect-lifecycle/bin"
          export PENTECT_UPDATE_ALLOW_PRERELEASE=1
          ./tools/install.sh --version "$version"
          binary="$PENTECT_INSTALL_DIR/pentect"
          test "$("$binary" version)" = "pentect $version"
          "$binary" update "$version" --force
          test "$("$binary" version)" = "pentect $version"
          "$binary" uninstall
          test ! -e "$binary"

  promote:
    name: Publish stable release
    needs: lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Promote validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --repo "$GITHUB_REPOSITORY"
