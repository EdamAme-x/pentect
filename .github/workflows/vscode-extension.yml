name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vscode-extension.yml"
      - "integrations/vscode/**"
  pull_request:
    paths:
      - ".github/workflows/vscode-extension.yml"
      - "integrations/vscode/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - working-directory: integrations/vscode
        run: npm ci
      - working-directory: integrations/vscode
        run: npm run check
      - working-directory: integrations/vscode
        run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pentect-vscode
          path: integrations/vscode/*.vsix
          if-no-files-found: error

  provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - working-directory: integrations/vscode
        run: npm ci
      - name: Build lightweight Pentect provider
        run: cargo build --locked --no-default-features -p pentect-cli
      - name: Verify provider boundary end to end
        working-directory: integrations/vscode
        env:
          PENTECT_BIN: ${{ github.workspace }}/target/debug/pentect
        run: npm run test:e2e
