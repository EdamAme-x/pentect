name: Current client compatibility

on:
  pull_request:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-client-compatibility
  cancel-in-progress: false

jobs:
  changes:
    name: Current client changes
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ github.event_name != 'pull_request' || steps.filter.outputs.clients }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            clients:
              - '.github/workflows/current-clients.yml'
              - '.github/workflows/release.yml'
              - 'crates/pentect-cli/src/client_descriptor.rs'
              - 'tools/client_smoke.py'
              - 'tools/install_client_smoke.sh'
              - 'tools/install_portable_client_smoke.py'
              - 'tools/installed_agent_e2e.py'
              - 'tools/test_client_smoke_coverage.py'
              - 'tools/verify_client_smoke_log.py'
              - 'tools/codex-app-smoke-fixture.c'
              - 'tools/codex-app-smoke-fixture.cs'
              - 'tools/claude-app-smoke-fixture.c'
              - 'tools/claude-app-smoke-fixture.cs'

  portable:
    name: Portable clients and apps (${{ matrix.os }})
    needs: changes
    if: github.repository == 'EdamAme-x/pentect' && needs.changes.outputs.clients == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PENTECT_LOG_DIR: ${{ github.workspace }}/.pentect-client-logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install latest Pentect from public endpoint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PENTECT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'pentect-client-smoke'
          $env:PENTECT_INSTALL_SKIP_PATH = '1'
          $installer = $null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $installer = Invoke-RestMethod https://pentect.dev/install
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 2
            }
          }
          Invoke-Expression $installer
          $binary = Join-Path $env:PENTECT_INSTALL_DIR 'pentect.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'public installer did not produce pentect.exe' }
          $redirects = & curl.exe -fsSI 'https://github.com/EdamAme-x/pentect/releases/latest/download/pentect-windows-x86_64.exe.sha256'
          $location = @($redirects | Where-Object { $_ -match '^location:' })[-1]
          if ($location -notmatch '/download/v([^/]+)/') { throw 'could not resolve latest public release' }
          $latest = $Matches[1]
          $installed = (& $binary version).Trim() -replace '^pentect\s+', ''
          if ($installed -ne $latest) { throw "public installer installed $installed, expected $latest" }
          "PENTECT_SMOKE_BINARY=$binary" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install latest Pentect from public endpoint (POSIX)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          set -eu
          install_dir="$RUNNER_TEMP/pentect-client-smoke"
          installer="$RUNNER_TEMP/pentect-install.sh"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45 \
            --proto '=https' --tlsv1.2 https://pentect.dev/install.sh -o "$installer"
          PENTECT_INSTALL_DIR="$install_dir" sh "$installer"
          test -x "$install_dir/pentect"
          latest=$(curl -fsSI https://github.com/EdamAme-x/pentect/releases/latest/download/pentect-linux-x86_64.sha256 |
            sed -n 's#.*[Ll]ocation: .*/download/v\([^/]*\)/.*#\1#p' | tail -n 1 | tr -d '\r')
          test -n "$latest"
          installed=$("$install_dir/pentect" version | sed 's/^pentect //')
          test "$installed" = "$latest"
          printf 'PENTECT_SMOKE_BINARY=%s\n' "$install_dir/pentect" >> "$GITHUB_ENV"
      - name: Install current portable clients
        run: python tools/install_portable_client_smoke.py --mode latest
      - name: Start all current portable clients
        run: python tools/client_smoke.py --group portable
      - name: Verify installed Codex and OpenCode handle flows
        run: python tools/installed_agent_e2e.py --pentect "${{ env.PENTECT_SMOKE_BINARY }}"
      - name: Start both protected desktop app contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { throw 'Framework C# compiler is unavailable' }
          $codexFixture = Join-Path $env:RUNNER_TEMP 'codex-app-fixture.exe'
          $codexSource = (Resolve-Path 'tools/codex-app-smoke-fixture.cs').Path
          & $csc /nologo /target:exe "/out:$codexFixture" $codexSource
          if ($LASTEXITCODE -ne 0) { throw 'Codex fixture compilation failed' }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Force $env:CODEX_HOME | Out-Null
          $config = Join-Path $env:CODEX_HOME 'config.toml'
          '# current client smoke sentinel' | Set-Content -Encoding utf8 $config
          $before = (Get-FileHash -Algorithm SHA256 $config).Hash
          & $env:PENTECT_SMOKE_BINARY codex app --app $codexFixture --upstream https://api.openai.com/v1
          if ($LASTEXITCODE -ne 0) { throw 'Codex App contract failed' }
          if ((Get-FileHash -Algorithm SHA256 $config).Hash -ne $before) { throw 'Codex config was modified' }

          $claudeFixture = Join-Path $env:RUNNER_TEMP 'claude-app-fixture.exe'
          $claudeSource = (Resolve-Path 'tools/claude-app-smoke-fixture.cs').Path
          & $csc /nologo /target:exe "/out:$claudeFixture" $claudeSource
          if ($LASTEXITCODE -ne 0) { throw 'Claude fixture compilation failed' }
          # Windows root-store trust opens an OS confirmation UI. The dedicated
          # CA lifecycle test covers add/find/remove; this headless smoke checks
          # the installed CLI and app contract without opening that dialog.
          & $env:PENTECT_SMOKE_BINARY claude app --check --app $claudeFixture --upstream https://api.anthropic.com
          if ($LASTEXITCODE -ne 0) { throw 'Claude Desktop contract failed' }
      - name: Start both protected desktop app contracts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          codex_fixture="$RUNNER_TEMP/codex-app-fixture"
          cc -std=c11 -Wall -Wextra -Werror tools/codex-app-smoke-fixture.c -o "$codex_fixture"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          printf '%s\n' '# current client smoke sentinel' > "$CODEX_HOME/config.toml"
          cp "$CODEX_HOME/config.toml" "$RUNNER_TEMP/config.before"
          "$PENTECT_SMOKE_BINARY" codex app --app "$codex_fixture" --upstream https://api.openai.com/v1
          cmp "$RUNNER_TEMP/config.before" "$CODEX_HOME/config.toml"

          claude_fixture="$RUNNER_TEMP/claude-app-fixture"
          cc -std=c11 -Wall -Wextra -Werror tools/claude-app-smoke-fixture.c -o "$claude_fixture"
          "$PENTECT_SMOKE_BINARY" claude app --yes --app "$claude_fixture" --upstream https://api.anthropic.com
      - name: Verify client diagnostics
        run: >-
          python tools/verify_client_smoke_log.py
          "${{ env.PENTECT_LOG_DIR }}/pentect.log"
          codex claude opencode pi codex-app claude-app
      - name: Uninstall direct installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PENTECT_SMOKE_BINARY uninstall
          for ($attempt = 0; $attempt -lt 300 -and (Test-Path -LiteralPath $env:PENTECT_SMOKE_BINARY); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $env:PENTECT_SMOKE_BINARY) { throw 'uninstall did not remove Pentect' }
      - name: Uninstall direct installation (POSIX)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          "$PENTECT_SMOKE_BINARY" uninstall
          test ! -e "$PENTECT_SMOKE_BINARY"

  current-client-gate:
    name: Current Client Gate
    if: always()
    needs: [changes, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require applicable current-client jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$PORTABLE_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
