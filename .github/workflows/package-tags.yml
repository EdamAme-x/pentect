name: Package version tags

on:
  push:
    branches: [main]
    paths:
      - packaging/release.json
      - .github/workflows/package-tags.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'EdamAme-x/pentect'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable package metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packaging/release.json)
          release_tag=$(jq -r .tag packaging/release.json)
          test "$release_tag" = "v$version"
          release=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
          echo "tag=nix-v$version" >> "$GITHUB_ENV"
      - name: Publish immutable Nix version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(git ls-remote origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')
          if test -z "$existing"; then
            existing=$(git ls-remote origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')
          fi
          if test -n "$existing"; then
            test "$existing" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "Pentect Nix package ${tag#nix-v}"
          git config --local credential.helper '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
          git push origin "refs/tags/$tag"
          git config --local --unset-all credential.helper
