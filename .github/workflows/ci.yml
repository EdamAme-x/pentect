name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      detector: ${{ steps.filter.outputs.detector }}
      ocr: ${{ steps.filter.outputs.ocr }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            detector:
              - '.github/workflows/ci.yml'
              - '.gitmodules'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-core/**'
              - 'benchmarks/CredData'
              - 'benchmarks/CredData/meta/**'
              - 'benchmarks/CredData/snapshot.json'
              - 'tools/credsweeper-sidecar/**'
              - 'tools/pentect-bench/**'
            ocr:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-runtime/assets/ocr/**'
              - 'crates/pentect-runtime/src/image_ocr.rs'
            plugins:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-cli/src/plugins.rs'
              - 'crates/pentect-cli/src/plugins_cmd.rs'
              - 'crates/pentect-cli/src/main.rs'
              - 'crates/pentect-cli/src/codex_app.rs'
              - 'crates/pentect-cli/src/claude_app_proxy.rs'
              - 'crates/pentect-cli/src/claude_http_proxy.rs'
              - 'crates/pentect-runtime/src/masking.rs'
              - 'crates/pentect-runtime/src/plugin_middleware.rs'
              - 'plugins/**'
              - 'protocol/**'
              - 'sdk/rust/pentect-plugin/**'

  native-ocr:
    name: Native OCR (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.ocr == 'true'
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        if: needs.changes.outputs.ocr == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes.outputs.ocr == 'true'
      - name: Build native OCR
        if: needs.changes.outputs.ocr == 'true'
        run: cargo build -p pentect-cli --features ocr --locked
      - name: No native changes
        if: needs.changes.outputs.ocr != 'true'
        run: echo "No native changes"

  plugin-platform:
    name: Plugins (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.plugins == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        if: needs.changes.outputs.plugins == 'true'
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes.outputs.plugins == 'true'
      - name: Test plugin runtime
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-runtime plugin_middleware::tests --locked
      - name: Test plugin CLI
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-cli plugins::tests --bin pentect --locked
      - name: Test plugin lifecycle CLI
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-cli plugins_cmd::tests --bin pentect --locked
      - name: Check plugin SDK
        if: needs.changes.outputs.plugins == 'true'
        run: cargo check --manifest-path sdk/rust/pentect-plugin/Cargo.toml --target wasm32-unknown-unknown
      - name: No plugin changes
        if: needs.changes.outputs.plugins != 'true'
        run: echo "No plugin changes"

  test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all --check
      - name: Verify third-party licenses
        run: python tools/generate_licenses.py --check
      - name: Verify package metadata
        run: |
          python tools/update_package_metadata.py --metadata-file packaging/release.json --check
          sh -n tools/install.sh tools/install-apt.sh tools/package_deb.sh tools/build_apt_repository.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check WebAssembly plugin SDK
        run: cargo check --manifest-path sdk/rust/pentect-plugin/Cargo.toml --target wasm32-unknown-unknown --example wasm
      - name: Test
        run: cargo test --all-features
      - name: Test (rules-only, no default features)
        if: needs.changes.outputs.detector == 'true'
        run: cargo test -p pentect-core --no-default-features
      - name: Install CredSweeper oracle dependencies
        if: needs.changes.outputs.detector == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/credsweeper-sidecar/runtime-requirements.txt
      - name: Prepare CredData shard
        if: needs.changes.outputs.detector == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import binascii
          import json
          from pathlib import Path

          root = Path("benchmarks/CredData")
          snapshot_path = root / "snapshot.json"
          snapshot = json.loads(snapshot_path.read_text())
          shard = {
              repo_id: url
              for repo_id, url in snapshot.items()
              if f"{binascii.crc32(bytes.fromhex(repo_id)):08x}" == "02dfa7ec"
          }
          if len(shard) != 1:
              raise SystemExit(f"expected one CredData shard, got {len(shard)}")
          snapshot_path.write_text(json.dumps(shard, indent=2) + "\n")
          for meta_path in (root / "meta").glob("*.csv"):
              if meta_path.name != "02dfa7ec.csv":
                  meta_path.unlink()
          PY
          (cd benchmarks/CredData && python download_data.py --clean_data --jobs 1)
      - name: CredSweeper parity shard
        if: needs.changes.outputs.detector == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/credsweeper-parity"
          mkdir -p "$out"
          cargo run --quiet --manifest-path tools/pentect-bench/Cargo.toml -- creddata benchmarks/CredData \
            --repo 02dfa7ec \
            --limit 100 \
            --ignore-x \
            --save-credsweeper-json "$out/rust.json" \
            --save-credsweeper-paths "$out/paths.txt" \
            --json
          mapfile -t paths < "$out/paths.txt"
          PYTHONPATH="$PWD/crates/pentect-core/vendors/CredSweeper" \
            python tools/credsweeper-sidecar/sidecar.py "${paths[@]}" --output "$out/oracle.json"
          cargo run --quiet --manifest-path tools/pentect-bench/Cargo.toml -- credsweeper-parity \
            "$out/rust.json" \
            "$out/oracle.json" \
            --min-precision 1 \
            --min-recall 1 \
            --json
