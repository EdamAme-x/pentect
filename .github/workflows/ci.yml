name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify Pi extension package
        working-directory: integrations/pi
        run: |
          npm run check
          npm test
          npm pack --dry-run
          npm pkg set "dependencies.pentect=$(npm view pentect version)"
          node ../../tools/smoke_pi_package.mjs 0.0.0 0.84.1

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      detector: ${{ steps.filter.outputs.detector }}
      ocr: ${{ steps.filter.outputs.ocr }}
      plugins: ${{ steps.filter.outputs.plugins }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            detector:
              - '.github/workflows/ci.yml'
              - '.github/actions/rust-toolchain/**'
              - '.gitmodules'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-core/**'
            ocr:
              - '.github/workflows/ci.yml'
              - '.github/actions/rust-toolchain/**'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-runtime/assets/ocr/**'
              - 'crates/pentect-runtime/src/image_ocr.rs'
            plugins:
              - '.github/workflows/ci.yml'
              - '.github/actions/rust-toolchain/**'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-cli/src/plugins.rs'
              - 'crates/pentect-cli/src/plugins_cmd.rs'
              - 'crates/pentect-cli/src/main.rs'
              - 'crates/pentect-cli/src/codex_app.rs'
              - 'crates/pentect-cli/src/claude_app_proxy.rs'
              - 'crates/pentect-cli/src/claude_http_proxy.rs'
              - 'crates/pentect-runtime/src/masking.rs'
              - 'crates/pentect-runtime/src/plugin_middleware.rs'
              - 'plugins/**'
              - 'protocol/**'
              - 'sdk/**'
            apps:
              - '.github/workflows/ci.yml'
              - '.github/actions/rust-toolchain/**'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'rust-toolchain*'
              - 'crates/pentect-cli/src/claude_app_proxy.rs'
              - 'crates/pentect-cli/src/claude_http_proxy.rs'
              - 'crates/pentect-cli/src/codex_app.rs'
              - 'crates/pentect-cli/src/http_files.rs'
              - 'crates/pentect-cli/src/main.rs'
              - 'crates/pentect-cli/src/openai_http_proxy.rs'
              - 'crates/pentect-cli/src/remote_content.rs'
              - 'crates/pentect-cli/src/upstream.rs'
              - 'crates/pentect-runtime/**'
              - 'guides/apps.md'
              - 'COMPATIBILITY.md'

  native-ocr:
    name: Native OCR (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.ocr == 'true'
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        if: needs.changes.outputs.ocr == 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes.outputs.ocr == 'true'
      - name: Build native OCR
        if: needs.changes.outputs.ocr == 'true'
        run: cargo build -p pentect-cli --features ocr --locked
      - name: No native changes
        if: needs.changes.outputs.ocr != 'true'
        run: echo "No native changes"

  plugin-platform:
    name: Plugins (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.plugins == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        if: needs.changes.outputs.plugins == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes.outputs.plugins == 'true'
      - name: Test plugin runtime
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-runtime plugin_middleware::tests --locked
      - name: Test plugin CLI
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-cli plugins::tests --bin pentect --locked
      - name: Test plugin lifecycle CLI
        if: needs.changes.outputs.plugins == 'true'
        run: cargo test -p pentect-cli plugins_cmd::tests --bin pentect --locked
      - name: Check plugin SDK
        if: needs.changes.outputs.plugins == 'true'
        run: cargo check --manifest-path sdk/rust/pentect-plugin/Cargo.toml --target wasm32-unknown-unknown
      - name: Test Command plugin SDKs
        if: needs.changes.outputs.plugins == 'true'
        env:
          PYTHONPATH: sdk/python
        run: |
          python -m unittest discover sdk/python/tests
          node --test sdk/javascript/test.mjs
      - name: Test OpenAI Privacy Filter bridge
        if: needs.changes.outputs.plugins == 'true'
        run: python -m unittest discover plugins/openai-privacy-filter/tests
      - name: No plugin changes
        if: needs.changes.outputs.plugins != 'true'
        run: echo "No plugin changes"

  app-platform:
    name: Desktop app boundaries (${{ matrix.os }})
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.apps == 'true'
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        if: needs.changes.outputs.apps == 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.changes.outputs.apps == 'true'
      - name: Test Codex App launcher and recovery
        if: needs.changes.outputs.apps == 'true'
        run: python tools/run_filtered_tests.py codex_app::tests
      - name: Test Claude Desktop gateway
        if: needs.changes.outputs.apps == 'true'
        run: python tools/run_filtered_tests.py claude_app_proxy::tests
      - name: Test Windows npm command shims
        if: needs.changes.outputs.apps == 'true' && runner.os == 'Windows'
        run: cargo test -p pentect-cli --no-default-features windows_npm_cmd_shim --locked
      - name: No app changes
        if: needs.changes.outputs.apps != 'true'
        run: echo "No app changes"

  test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all --check
      - name: Verify third-party licenses
        run: python tools/generate_licenses.py --check
      - name: Verify package metadata
        run: |
          python tools/update_package_metadata.py --metadata-file packaging/release.json --check
          sh -n tools/install.sh tools/install-apt.sh tools/package_deb.sh tools/build_apt_repository.sh tools/propose_automation_pr.sh
          sh tools/test_propose_automation_pr.sh
      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          foreach ($path in @('tools/install.ps1', 'tools/release_live_e2e.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "$path`n$($errors | Out-String)"
            }
          }
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check WebAssembly plugin SDK
        run: cargo check --manifest-path sdk/rust/pentect-plugin/Cargo.toml --target wasm32-unknown-unknown --example wasm
      - name: Test
        run: cargo test --all-features
      - name: Test (rules-only, no default features)
        if: needs.changes.outputs.detector == 'true'
        run: cargo test -p pentect-core --no-default-features
