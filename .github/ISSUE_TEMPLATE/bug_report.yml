name: Bug report
description: Tell us about something that is not working.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove secrets, personal data, and private system details before posting. Report security vulnerabilities privately through the Security tab.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Tell us what happened. Add steps, commands, or screenshots only if useful. Never include secrets.
    validations:
      required: true
