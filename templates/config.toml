# Copy to .pentect/config.toml.

plugins = []
# Plugin runtime data is stored outside the repository in OS user data.

[handles]
scope = "device"

[agent]
required = false

[image]
ocr = true
redaction = "black"
unscanned = "block"

[files]
remember = true

# User config only. The bundle is loaded from disk, verified with the pinned
# Ed25519 public key, then applied above project and user settings.
# [team_policy]
# bundle = "/absolute/path/to/pentect-policy.json"
# issuer = "example-security"
# public_key = "64-lowercase-hex-characters"
