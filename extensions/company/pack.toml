# Official sample pack for company-specific confidential terms.
# Enable with:
#   pentect mask --extensions company
#   pentect codex --extensions company

[[detector]]
keywords = [
  "Project Aurora",
  "customer-data-export",
  "vault.acme.internal",
]
category = "secret"
label = "COMPANY_CONFIDENTIAL"
confidence = "high"

[[detector]]
pattern = '(?i)\b(?:tenant|workspace|account)[_-]?id\s*[:=]\s*([A-Z]{3}-[0-9]{8})\b'
prefilter = ["tenant", "workspace", "account"]
capture = 1
category = "secret"
label = "COMPANY_ACCOUNT_ID"
confidence = "high"
