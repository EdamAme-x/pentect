# Official sample pack for Japanese business identifiers.
# Enable with:
#   pentect mask --extensions jp-business

[[detector]]
pattern = '(?i)(?:社員番号|employee[_ -]?id|emp[_ -]?id)[^\r\nA-Za-z0-9]{0,16}([A-Z]{2}[0-9]{6})'
prefilter = ["社員番号", "employee", "emp"]
capture = 1
category = "pii"
label = "EMPLOYEE_ID"
confidence = "high"

[[detector]]
pattern = '(?i)(?:顧客ID|customer[_ -]?id|client[_ -]?id)[^\r\nA-Za-z0-9]{0,16}([A-Z]{3}-[0-9]{8})'
prefilter = ["顧客", "customer", "client"]
capture = 1
category = "identifier"
label = "CUSTOMER_ID"
confidence = "high"

